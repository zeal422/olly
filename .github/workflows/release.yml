name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full test suite
        run: cargo test --all-targets --all-features

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            artifact_suffix: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            artifact_suffix: linux-aarch64
            apt_packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            artifact_suffix: macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            artifact_suffix: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            artifact_suffix: windows-x86_64

    steps:
      - uses: actions/checkout@v4
      - name: Install Linux cross compiler
        if: ${{ matrix.apt_packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (Unix)
        if: runner.os != 'Windows'
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

      - name: Build release binary (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          archive_name="olly-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.${{ matrix.archive_ext }}"
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${archive_name}" olly

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $archiveName = "olly-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.${{ matrix.archive_ext }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/olly.exe" -DestinationPath "dist/$archiveName" -Force

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./scripts/build-installer.ps1 -SkipBuild -Target "${{ matrix.target }}" -Version $version
          Copy-Item "dist/windows-installer/Olly-Setup-$version.exe" "dist/olly-${{ github.ref_name }}-windows-installer.exe" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: olly-${{ github.ref_name }}-${{ matrix.artifact_suffix }}
          path: dist/*

  checksums:
    name: Generate checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: olly-*
          merge-multiple: true
          path: dist

      - name: Create SHA256SUMS
        run: |
          find dist -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS.txt

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: olly-${{ github.ref_name }}-checksums
          path: dist/SHA256SUMS.txt

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes from git-cliff
        id: git_cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .git-cliff.toml
          args: --latest --strip all

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: olly-*
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git_cliff.outputs.content }}
          files: dist/*
