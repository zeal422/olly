[package]
name = "olly"
version = "0.0.19"
edition = "2021"
description = "WhatsApp-like terminal client for Ollama with workspaces and persistent chat."
readme = "README.md"
repository = "https://github.com/yourname/olly"
homepage = "https://github.com/yourname/olly"
documentation = "https://docs.rs/olly"
license-file = "LICENSE"
keywords = ["ollama", "tui", "cli", "chat", "rust"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.5.31", features = ["derive"] }
copypasta = "0.10"
crossterm = "0.28.1"
dirs = "5.0.1"
futures-util = "0.3.31"
glob = "0.3"
hex = "0.4.3"
ratatui = "0.29.0"
regex = "1"
reqwest = { version = "0.12.14", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
sha2 = "0.10.8"
shlex = "1.3.0"
syntect = { version = "5.2.0", default-features = false, features = ["default-fancy"] }
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "time", "process"] }
toml = "0.8.20"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
